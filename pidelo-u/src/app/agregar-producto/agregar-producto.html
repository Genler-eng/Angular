<section>
  <div class="formulario">
    <h2>{{ editando() ? '✏️ Editar producto' : '⚙️ Agregar producto' }}</h2>

    <form (ngSubmit)="guardar()">
      <label for="nombre">Nombre del producto:</label>
      <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Ej: Hamburguesa especial">

      <label for="precio">Precio ($):</label>
      <input id="precio" type="number" [(ngModel)]="precio" name="precio" placeholder="0">

      <div class="botones">
        <button type="submit" class="guardar">
          {{ editando() ? '💾 Guardar cambios' : '➕ Agregar al catálogo' }}
        </button>
        @if (editando()) {
          <button type="button" class="cancelar" (click)="cancelar()">Cancelar</button>
        }
      </div>
    </form>
  </div>

  <h2>Productos del menú</h2>
  <div class="grid">
    @for (p of productos(); track p.id) {
      <app-producto-admin
        [producto]="p"
        (editar)="editar($event)"
        (eliminar)="eliminar($event)"
      />
    } @empty {
      <p class="vacio"><em>No hay productos en el menú. Agrega el primero.</em></p>
    }
  </div>
</section>
